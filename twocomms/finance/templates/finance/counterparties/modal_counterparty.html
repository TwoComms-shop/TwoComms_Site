{# Модалка створення/редагування контрагента. #}
<div class="fin-modal-overlay" id="fin-cp-form-modal" hidden>
  <div class="fin-modal-card" role="dialog" aria-modal="true" aria-labelledby="fin-cp-form-title">
    <div class="fin-modal-head">
      <h3 id="fin-cp-form-title">Новий контрагент</h3>
      <button type="button" class="fin-modal-close" data-cpf-close aria-label="Закрити">×</button>
    </div>
    <form class="fin-modal-body" id="fin-cp-form">
      {% csrf_token %}
      <input type="hidden" id="fin-cp-id" value="">
      <div class="fin-form-alert" id="fin-cp-alert" hidden></div>

      <div class="fin-field-row">
        <label class="fin-field">
          <span>Назва *</span>
          <input type="text" id="fin-cp-name" class="fin-input" required placeholder="Напр. ТОВ «Магазин»">
        </label>
        <label class="fin-field fin-field--cur">
          <span>Тип</span>
          <select id="fin-cp-type" class="fin-select">
            {% for val, label in types %}
            <option value="{{ val }}">{{ label }}</option>
            {% endfor %}
          </select>
        </label>
      </div>

      <div class="fin-field-row">
        <label class="fin-field">
          <span>Група</span>
          <input type="text" id="fin-cp-group" class="fin-input" placeholder="Напр. Опт, Роздріб">
        </label>
        <label class="fin-field">
          <span>ЄДРПОУ / ІПН</span>
          <input type="text" id="fin-cp-edrpou" class="fin-input">
        </label>
      </div>

      <button type="button" class="fin-disclosure" id="fin-cp-toggle-req" aria-expanded="false">
        <span class="fin-disclosure__chev" aria-hidden="true">▸</span> Реквізити та контакти
      </button>
      <div class="fin-disclosure__body" id="fin-cp-req-wrap" hidden>
        <div class="fin-field-row">
          <label class="fin-field"><span>IBAN</span><input type="text" id="fin-cp-iban" class="fin-input"></label>
          <label class="fin-field"><span>Країна</span><input type="text" id="fin-cp-country" class="fin-input"></label>
        </div>
        <label class="fin-field"><span>Адреса</span><input type="text" id="fin-cp-address" class="fin-input"></label>
        <div class="fin-field-row">
          <label class="fin-field"><span>Телефон</span><input type="text" id="fin-cp-phone" class="fin-input"></label>
          <label class="fin-field"><span>Email</span><input type="email" id="fin-cp-email" class="fin-input"></label>
        </div>
        <div class="fin-field-row">
          <label class="fin-field"><span>Telegram</span><input type="text" id="fin-cp-telegram" class="fin-input"></label>
          <label class="fin-field"><span>Відповідальний</span><input type="text" id="fin-cp-responsible" class="fin-input"></label>
        </div>
        <label class="fin-field"><span>Примітка</span><textarea id="fin-cp-note" class="fin-input fin-textarea" rows="2"></textarea></label>
      </div>

      <div class="fin-modal-foot">
        <button type="button" class="fin-btn fin-btn--ghost" data-cpf-close>Скасувати</button>
        <button type="submit" class="fin-btn fin-btn--primary" id="fin-cp-submit">Створити</button>
      </div>
    </form>
  </div>
</div>

<div class="fin-modal-overlay" id="fin-cp-policy-modal" hidden>
  <div class="fin-modal-card fin-cp-policy-modal" role="dialog" aria-modal="true" aria-labelledby="fin-cp-policy-title">
    <div class="fin-modal-head">
      <div><h3 id="fin-cp-policy-title">Автокласифікація контрагента</h3><p id="fin-cp-policy-subtitle" class="fin-modal-subtitle"></p></div>
      <button type="button" class="fin-modal-close" data-cpp-close aria-label="Закрити">×</button>
    </div>
    <form class="fin-modal-body" id="fin-cp-policy-form">
      <div class="fin-form-alert" id="fin-cp-policy-alert" hidden></div>
      <label class="fin-policy-toggle"><span><strong>Увімкнути правило</strong><small>Застосовується до нових фактичних операцій.</small></span><span class="fin-switch"><input id="fin-cp-policy-enabled" type="checkbox"><i class="fin-switch__ui"></i></span></label>
      <div class="fin-field-row">
        <label class="fin-field"><span>Напрямок операції</span><select id="fin-cp-policy-type" class="fin-select"><option value="expense">Витрата</option><option value="income">Надходження</option></select></label>
        <label class="fin-field"><span>Контур обліку</span><select id="fin-cp-policy-scope" class="fin-select"><option value="business">Бізнес</option><option value="personal">Особисте</option><option value="mixed">Змішане</option><option value="unknown">Не визначено</option></select></label>
      </div>
      <label class="fin-field"><span>Рекомендована категорія</span><select id="fin-cp-policy-category" class="fin-select" required></select></label>
      <label class="fin-field"><span>Значення операції</span><select id="fin-cp-policy-kind" class="fin-select"><option value="operating_expense">Операційна витрата</option><option value="sale">Продаж</option><option value="investment">Інвестиція</option><option value="expense_refund">Повернення витрат</option><option value="debt_repayment">Повернення боргу</option><option value="personal_transfer">Особистий переказ</option><option value="adjustment">Коригування</option></select></label>
      <label class="fin-policy-toggle"><span><strong>Запитувати підтвердження</strong><small>Перед зміною категорії покажемо варіанти «Так» або «Ні, обрати інше».</small></span><span class="fin-switch"><input id="fin-cp-policy-confirm" type="checkbox"><i class="fin-switch__ui"></i></span></label>
      <label class="fin-field"><span>Питання для підтвердження</span><input id="fin-cp-policy-prompt" class="fin-input" maxlength="255" placeholder="Напр. Це оплата оренди та комуналки?"></label>
      <div class="fin-modal-foot"><button type="button" class="fin-btn fin-btn--ghost" data-cpp-close>Скасувати</button><button type="submit" class="fin-btn fin-btn--primary">Зберегти правило</button></div>
    </form>
  </div>
</div>
