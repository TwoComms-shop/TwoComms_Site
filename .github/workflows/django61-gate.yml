name: Django 6.1 non-DTF gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "twocomms/dtf/**"
      - "twocomms/twocomms/urls_dtf.py"
      - "specs/dtf-codex/**"
      - "docs/operations/**"
      - "docs/plans/**"
      - "docs/qa/*.md"
      - "dj6_update_all.md"
  pull_request:
    paths-ignore:
      - "twocomms/dtf/**"
      - "twocomms/twocomms/urls_dtf.py"
      - "specs/dtf-codex/**"

permissions:
  contents: read

jobs:
  django61:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up exact project Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install MariaDB client build headers
        run: sudo apt-get update && sudo apt-get install --yes libmariadb-dev
      - name: Install the immutable dependency lock
        working-directory: twocomms
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify exact runtime and lock
        run: |
          python scripts/verify_project_runtime.py
          python scripts/verify_locked_requirements.py --lock twocomms/requirements.lock
      - name: Run Stage 0 workflow contracts
        run: python -m unittest tests.test_django61_stage0_contracts -v
      - name: Run stable Stage 0 policy shards in parallel
        run: python scripts/run_django61_ci_shards.py --jobs 2
      - name: Run no-network system and migration checks
        working-directory: twocomms
        run: |
          python manage.py check --database=default --settings=test_settings_no_network_non_dtf
          python manage.py makemigrations --check --dry-run --noinput --settings=test_settings_migrations_non_dtf
      - name: Import non-DTF management commands
        run: python scripts/check_management_commands.py --output command-smoke.json
      - name: Reject new Django 7 deprecations
        run: python scripts/run_django_warning_gate.py --output warning-gate.json
      - name: Run stable Django compatibility tests
        working-directory: twocomms
        run: |
          python manage.py test storefront.tests.test_product_video --settings=test_settings_no_network_non_dtf --noinput --parallel 1
      - name: Run Instagram reply and context regressions
        working-directory: twocomms
        env:
          GOOGLE_INDEXING_ENABLED: "0"
          INDEXNOW_ENABLED: "0"
        run: |
          python manage.py test \
            management.tests_ig_conversation_activity \
            management.tests_ig_live_identity_echo_20261022 \
            management.tests_ig_profile \
            management.tests_ig_avatar \
            management.tests_ig_live_conversation_contract_20261022 \
            management.tests_ig_manager_case_continuity_20261022 \
            management.tests_ig_live_burst_fairness_20261022 \
            management.tests_ig_size_aliases_20261022 \
            management.tests_ig_product_weight_20261022 \
            management.tests_ig_standard_funnel_20261022 \
            management.tests_ig_size_grid_authority_20261022 \
            management.tests_ig_conversion_audit_schema_20261022 \
            management.tests_ig_conversion_audit_prompt_20261023 \
            management.tests_ig_conversion_audit_analysis_20261022 \
            management.tests_ig_conversion_audit_stats_20261022 \
            management.tests_ig_stock_authority_20261023 \
            management.tests_ig_source_cart_catalog \
            management.tests_ig_stock_catalog_copy_20261023 \
            management.tests_ig_stock_claim_guard_20261023 \
            management.tests_ig_stock_request_scope_20261023 \
            management.tests_ig_palette_intent_20261023 \
            management.tests_ig_standard_funnel_qa \
            management.tests_ig_analysis_lane_isolation_20261023 \
            management.tests_ig_analysis_lane \
            management.tests_ig_worker_progress \
            management.tests_ig_daemon \
            management.tests_ig_daemon_progress \
            management.tests_ig_daemon_health \
            management.tests_ig_payment_observation_worker \
            management.tests_ig_memory_lifecycle \
            management.tests_ig_reply_truth_seams_20261022 \
            management.tests_ig_revision_selection_noop_20261023 \
            management.tests_ig_response_guard \
            management.tests_ig_media_response \
            management.tests_bot_catalog \
            management.tests_ig_communication_policy_20261022 \
            management.tests_ig_manu_context_budget_20261021 \
            management.tests_ig_manu_business_delivery_20261021 \
            management.tests_ig_manu_deadline_20261021 \
            management.tests_ig_manu_deadline_policy_20261021 \
            management.tests_ig_manu_finalization_faults_20261021 \
            management.tests_ig_manu_language_20261021 \
            management.tests_ig_manu_liveness_20261021 \
            management.tests_ig_manu_manager_wait_20261021 \
            management.tests_ig_manu_recipient_20261021 \
            management.tests_ig_manu_timing_authority_20261021 \
            management.tests_ig_manu_console_faults_20261021 \
            management.tests_ig_manu_customer_pool_20261021 \
            management.tests_ig_manu_deadline_successor_20261021 \
            management.tests_ig_manu_queue_fairness_20261021 \
            management.tests_ig_manu_recruitment_20261021 \
            management.tests_ig_operator_reply_drafts \
            management.tests_ig_manu_catalog_locale_20261021 \
            management.tests_ig_manu_catalog_poll_20261021 \
            management.tests_ig_manu_customer_pool_mariadb_20261021 \
            management.tests_ig_manu_purpose_poll_20261021 \
            management.tests_ig_business_cooperation \
            management.tests_ig_fulfillment_prompt_budget \
            management.tests_ig_policy_fault_ack \
            management.tests_ig_revision_liveness \
            management.tests_ig_ingress_reply_liveness \
            management.tests_ig_opaque_inbound \
            management.tests_ig_unanswered_obligations \
            management.tests_ig_captured_policy_inputs \
            management.tests_ig_shopping_journey_qa_20261020 \
            management.tests_ig_handoff_journey_qa_20261020 \
            management.tests_ig_checkout_journey_qa_20261020 \
            management.tests_ig_knowledge_journey_qa_20261020 \
            management.tests_ig_rate_handoff_qa_20261020 \
            management.tests_ig_referral_context \
            management.tests_ig_webhook_extract \
            management.tests_ig_webhook_inbox \
            management.tests_ig_webhook_security \
            management.tests_ig_conversion_ad_context \
            management.tests_ig_conversion_memory \
            management.tests_ig_untrusted_memory_and_language \
            management.tests_ig_typed_memory_reader \
            management.tests_ig_typed_memory_read_budget \
            management.tests_ig_memory_timeline_consumers \
            management.tests_ig_fulfillment_stock_api \
            management.tests_ig_mariadb_runner \
            --settings=test_settings_no_network_non_dtf --noinput --parallel 1
      - name: Run size guide authority regressions
        working-directory: twocomms
        run: |
          python manage.py test storefront.tests.test_product_size_guides storefront.tests.test_size_guide_authority_20261022 --settings=test_settings_no_network_non_dtf --noinput --parallel 1
      - name: Run live conversation UI regressions
        run: |
          node --test tests/js/management-bot-client-list.test.js tests/js/management-bot-live-sync.test.js tests/js/management-bot-chat-reading.test.js tests/js/management-bot-conversation-scroll.test.js tests/js/management-bot-conversion-audit.test.js tests/js/management-bot-stock-review.test.js tests/js/management-ig-fulfillment-review-reuse.test.cjs tests/js/management-ig-fulfillment-stock-sync.test.cjs tests/js/management-ig-restock-waiting-list.test.cjs twocomms/twocomms_django_theme/static/js/product-detail.test.js
      - name: Exercise production-like static pipeline
        run: python scripts/run_static_gate.py --output static-gate.json
      - name: Build sanitized non-DTF coverage inventory
        run: python scripts/build_non_dtf_inventory.py --output non-dtf-inventory.json
      - name: Validate tracked Django A/B evidence
        run: |
          python scripts/build_django61_baseline_artifact.py \
            --validate docs/qa/django61-full-ab-baseline.json
          python scripts/build_django61_baseline_artifact.py \
            --validate docs/qa/django61-targeted-ab-baseline.json
      - name: Capture full non-DTF smoke
        if: github.event_name == 'workflow_dispatch'
        id: full_non_dtf_smoke
        continue-on-error: true
        run: |
          python scripts/run_non_dtf_test_suite.py \
            --settings test_settings_no_network_non_dtf \
            --output full-non-dtf-smoke.log \
            --verbosity 1
      - name: Compare full smoke with tracked Django 6.1 baseline
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python scripts/build_django61_baseline_artifact.py \
            --tracked-artifact docs/qa/django61-full-ab-baseline.json \
            --compare-candidate-log full-non-dtf-smoke.log \
            --comparison-output full-non-dtf-comparison.json
      - name: Upload Stage 0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: django61-stage0-evidence
          path: |
            command-smoke.json
            warning-gate.json
            static-gate.json
            non-dtf-inventory.json
            full-non-dtf-smoke.log
            full-non-dtf-comparison.json
            docs/qa/django61-full-ab-baseline.json
            docs/qa/django61-targeted-ab-baseline.json
          if-no-files-found: warn
          retention-days: 14
