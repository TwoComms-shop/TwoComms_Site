            management.tests_ig_typed_memory_read_budget \
            management.tests_ig_memory_timeline_consumers \
            management.tests_ig_fulfillment_stock_api \
            management.tests_ig_mariadb_runner \
            --settings=test_settings_no_network_non_dtf --noinput --parallel 1
      - name: Run size guide authority regressions
        working-directory: twocomms
        run: |
          python manage.py test storefront.tests.test_product_size_guides storefront.tests.test_size_guide_authority_20261022 storefront.tests.test_qa23_cooperation_terms storefront.tests.test_owner_content_consistency storefront.tests.test_ig_checkout_recipient_labels_20261023 --settings=test_settings_no_network_non_dtf --noinput --parallel 1
      - name: Run live conversation UI regressions
        run: |
          node --test tests/js/management-bot-qa23-context-actions.test.js tests/js/management-ig-qa23-recipients.test.cjs
          node --test tests/js/management-bot-client-list.test.js tests/js/management-bot-live-sync.test.js tests/js/management-bot-chat-reading.test.js tests/js/management-bot-conversation-scroll.test.js tests/js/management-bot-conversion-audit.test.js tests/js/management-bot-stock-review.test.js tests/js/management-ig-fulfillment-review-reuse.test.cjs tests/js/management-ig-fulfillment-stock-sync.test.cjs tests/js/management-ig-restock-waiting-list.test.cjs twocomms/twocomms_django_theme/static/js/product-detail.test.js
      - name: Exercise production-like static pipeline
        run: python scripts/run_static_gate.py --output static-gate.json
      - name: Build sanitized non-DTF coverage inventory
        run: python scripts/build_non_dtf_inventory.py --output non-dtf-inventory.json
      - name: Validate tracked Django A/B evidence
        run: |
          python scripts/build_django61_baseline_artifact.py \
            --validate docs/qa/django61-full-ab-baseline.json
          python scripts/build_django61_baseline_artifact.py \
            --validate docs/qa/django61-targeted-ab-baseline.json
      - name: Capture full non-DTF smoke
        if: github.event_name == 'workflow_dispatch'
        id: full_non_dtf_smoke
        continue-on-error: true
        run: |
          python scripts/run_non_dtf_test_suite.py \
            --settings test_settings_no_network_non_dtf \
            --output full-non-dtf-smoke.log \
            --verbosity 1
      - name: Compare full smoke with tracked Django 6.1 baseline
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python scripts/build_django61_baseline_artifact.py \
            --tracked-artifact docs/qa/django61-full-ab-baseline.json \
            --compare-candidate-log full-non-dtf-smoke.log \
            --comparison-output full-non-dtf-comparison.json
      - name: Upload Stage 0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: django61-stage0-evidence
          path: |
            command-smoke.json
            warning-gate.json
            static-gate.json
            non-dtf-inventory.json
            full-non-dtf-smoke.log
            full-non-dtf-comparison.json
            docs/qa/django61-full-ab-baseline.json
            docs/qa/django61-targeted-ab-baseline.json
          if-no-files-found: warn
          retention-days: 14
