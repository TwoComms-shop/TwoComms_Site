name: Django 6.1 non-DTF gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "twocomms/dtf/**"
      - "twocomms/twocomms/urls_dtf.py"
      - "specs/dtf-codex/**"
      - "docs/operations/**"
      - "docs/plans/**"
      - "docs/qa/*.md"
      - "dj6_update_all.md"
  pull_request:
    paths-ignore:
      - "twocomms/dtf/**"
      - "twocomms/twocomms/urls_dtf.py"
      - "specs/dtf-codex/**"

permissions:
  contents: read

jobs:
  django61:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up exact project Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install MariaDB client build headers
        run: sudo apt-get update && sudo apt-get install --yes libmariadb-dev
      - name: Install the immutable dependency lock
        working-directory: twocomms
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify exact runtime and lock
        run: |
          python scripts/verify_project_runtime.py
          python scripts/verify_locked_requirements.py --lock twocomms/requirements.lock
      - name: Run Stage 0 workflow contracts
        run: python -m unittest tests.test_django61_stage0_contracts -v
      - name: Run stable Stage 0 policy shards in parallel
        run: python scripts/run_django61_ci_shards.py --jobs 2
      - name: Run no-network system and migration checks
        working-directory: twocomms
        run: |
          python manage.py check --database=default --settings=test_settings_no_network_non_dtf
          python manage.py makemigrations --check --dry-run --noinput --settings=test_settings_migrations_non_dtf
      - name: Import non-DTF management commands
        run: python scripts/check_management_commands.py --output command-smoke.json
      - name: Reject new Django 7 deprecations
        run: python scripts/run_django_warning_gate.py --output warning-gate.json
      - name: Run stable Django compatibility tests
        working-directory: twocomms
        run: |
          python manage.py test storefront.tests.test_product_video --settings=test_settings_no_network_non_dtf --noinput --parallel 1
      - name: Run Instagram reply and context regressions
        working-directory: twocomms
        env:
          GOOGLE_INDEXING_ENABLED: "0"
          INDEXNOW_ENABLED: "0"
        run: |
          python manage.py test \
            management.tests_ig_qa23_turn_parsing \
            management.tests_ig_qa23_business_cart \
            management.tests_ig_qa23_context_actions \
            management.tests_ig_qa23_conversion_causes \
            management.tests_ig_qa23_communication_preferences \
            management.tests_ig_qa23_terse_questions \
            management.tests_ig_q23_cooperation_policy \
            management.tests_ig_qa23_catalog_browsing \
