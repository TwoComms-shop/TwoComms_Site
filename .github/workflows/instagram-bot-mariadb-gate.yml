name: Instagram bot MariaDB gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "twocomms/requirements.lock"
      - ".python-version"
      - "scripts/verify_project_runtime.py"
      - "twocomms/management/**"
      - "twocomms/orders/models.py"
      - "twocomms/orders/promo_reservations.py"
      - "twocomms/storefront/services/loyalty_rewards.py"
      - "twocomms/storefront/services/size_guide_authority.py"
      - "twocomms/storefront/services/size_guides.py"
      - "twocomms/storefront/views/product.py"
      - "twocomms/storefront/tests/test_size_guide_authority_20261022.py"
      - "twocomms/product_catalog/size_grid_services.py"
      - "twocomms/finance/tests_migration_storage.py"
      - "twocomms/storefront/models.py"
      - "twocomms/storefront/migrations/0095_promocode_guest_ugc.py"
      - "scripts/run_mariadb_gate.py"
      - "twocomms/test_settings_mariadb.py"
      - "twocomms/twocomms/settings.py"
      - "twocomms/twocomms/production_settings.py"
      - "twocomms/test_network_guard.py"
      - "twocomms/test_support/**"
      - "twocomms/*/models.py"
      - "twocomms/*/migrations/**"
      - "!twocomms/dtf/**"
      - "twocomms/management/tests_ig_mariadb_lifecycle.py"
      - "twocomms/management/tests_test_settings_mariadb.py"
      - "tests/test_mariadb_gate_runner.py"
      - "tests/test_mariadb_workflow_contract.py"
      - ".github/workflows/instagram-bot-mariadb-gate.yml"
  pull_request:
    paths:
      - "twocomms/requirements.lock"
      - ".python-version"
      - "scripts/verify_project_runtime.py"
      - "twocomms/management/**"
      - "twocomms/orders/models.py"
      - "twocomms/orders/promo_reservations.py"
      - "twocomms/storefront/services/loyalty_rewards.py"
      - "twocomms/storefront/services/size_guide_authority.py"
      - "twocomms/storefront/services/size_guides.py"
      - "twocomms/storefront/views/product.py"
      - "twocomms/storefront/tests/test_size_guide_authority_20261022.py"
      - "twocomms/product_catalog/size_grid_services.py"
      - "twocomms/finance/tests_migration_storage.py"
      - "twocomms/storefront/models.py"
      - "twocomms/storefront/migrations/0095_promocode_guest_ugc.py"
      - "scripts/run_mariadb_gate.py"
      - "twocomms/test_settings_mariadb.py"
      - "twocomms/twocomms/settings.py"
      - "twocomms/twocomms/production_settings.py"
      - "twocomms/test_network_guard.py"
      - "twocomms/test_support/**"
      - "twocomms/*/models.py"
      - "twocomms/*/migrations/**"
      - "!twocomms/dtf/**"
      - "twocomms/management/tests_ig_mariadb_lifecycle.py"
      - "twocomms/management/tests_test_settings_mariadb.py"
      - "tests/test_mariadb_gate_runner.py"
      - "tests/test_mariadb_workflow_contract.py"
      - ".github/workflows/instagram-bot-mariadb-gate.yml"

permissions:
  contents: read

jobs:
  suites:
    name: MariaDB (${{ matrix.suite }})
    timeout-minutes: 45
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        suite:
          - lifecycle
          - checkout-concurrency
          - follow-ugc-concurrency
          - lease-concurrency
          - conversion-context
          - dialogue-quality
          - stock-authority
          - stock-authority-consumers
          - selection-idempotence
    services:
      mariadb:
        image: mariadb:11.4.12@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
        env:
          MARIADB_ROOT_PASSWORD: gate-root-password
          MARIADB_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
      - name: Set up exact project Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - name: Install MariaDB client build headers
        run: sudo apt-get update && sudo apt-get install --yes libmariadb-dev
      - name: Install locked dependencies
        working-directory: twocomms
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify exact project runtime
        run: python scripts/verify_project_runtime.py
      - name: Run runner contracts
        run: python -m unittest tests.test_mariadb_gate_runner tests.test_mariadb_workflow_contract -v
      - name: Run disposable MariaDB settings contracts
        working-directory: twocomms
        env:
          TEST_MARIADB_NAME: test_twocomms_ig_settings_contract
          TEST_MARIADB_USER: twc_ig_settings_contract
          TEST_MARIADB_PASSWORD: settings-contract-password
          TEST_MARIADB_HOST: 127.0.0.1
          TEST_MARIADB_PORT: "3306"
        run: python -m unittest management.tests_test_settings_mariadb -v
      - name: Run disposable MariaDB suite
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PORT: "3306"
          MARIADB_ADMIN_USER: root
          MARIADB_ADMIN_PASSWORD: gate-root-password
        run: |
          set -o pipefail
          python scripts/run_mariadb_gate.py --server-mode external --suite "${{ matrix.suite }}" 2>&1 | tee "mariadb-${{ matrix.suite }}-evidence.txt"
      - name: Upload sanitized MariaDB gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mariadb-${{ matrix.suite }}-evidence
          path: mariadb-${{ matrix.suite }}-evidence.txt
          if-no-files-found: warn
          retention-days: 7

  lifecycle:
    name: lifecycle
    needs: [suites]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every MariaDB suite to pass
        env:
          SUITES_RESULT: ${{ needs.suites.result }}
        run: test "$SUITES_RESULT" = success
